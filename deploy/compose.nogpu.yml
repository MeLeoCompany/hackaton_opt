# Машина без видеокарты NVIDIA. Базовый docker-compose.yml просит у docker устройство GPU —
# без него контейнер бэкенда просто не создастся. Этот оверлей снимает требование:
# система поднимается целиком, а планы считает OR-Tools на процессоре.
# Подключается сам: deploy/local.sh проверяет наличие видеокарты и добавляет его при нужде.
services:
  backend:
    deploy: !override {}
