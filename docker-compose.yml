services:
  postgres:
    image: postgres:16
    container_name: routing_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: routing
      POSTGRES_USER: routing
      POSTGRES_PASSWORD: routing
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8"
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routing -d routing"]
      interval: 5s
      timeout: 5s
      retries: 10

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.0
    container_name: routing_valhalla
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - valhalla_tiles_390:/custom_files
    environment:
      # Москва + область: в данных есть Домодедово, компактный экстракт по городу его не покрывает
      tile_urls: https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf
      server_threads: 12
      # тайлы собираются один раз и переиспользуются при следующих стартах
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
      build_elevation: "False"
      build_admins: "False"
      # маршрутизация с учётом времени суток нам не нужна, экономим на сборке
      build_time_zones: "False"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8002/status > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10m

  r5-osm:
    profiles: ["transit"]
    build:
      context: ./transit/osm_extract
    environment:
      R5_OSM_SOURCE: /source/central-fed-district-latest.osm.pbf
      R5_OSM_OUTPUT: /output/moscow-region.osm.pbf
      R5_OSM_BBOX: ${R5_OSM_BBOX:-35.0,54.1,41.0,57.0}
      R5_SOURCE_WAIT_SECONDS: ${R5_SOURCE_WAIT_SECONDS:-900}
    volumes:
      - valhalla_tiles_390:/source:ro
      - r5_osm:/output
    depends_on:
      valhalla:
        condition: service_started

  r5:
    profiles: ["transit"]
    build:
      context: ./transit/r5_service
    container_name: routing_r5
    restart: unless-stopped
    environment:
      R5_OSM_PATH: /data/osm/moscow-region.osm.pbf
      R5_GTFS_PATH: /data/gtfs/moscow-pilot.gtfs.zip
      R5_SOURCE_WAIT_SECONDS: ${R5_SOURCE_WAIT_SECONDS:-900}
      R5_METRO_ENTRY_SECONDS: ${R5_METRO_ENTRY_SECONDS:-240}
      R5_METRO_EXIT_SECONDS: ${R5_METRO_EXIT_SECONDS:-240}
      R5_WALKING_SPEED_KMH: ${R5_WALKING_SPEED_KMH:-4.8}
      R5_RELIABILITY_BUFFER_RATIO: ${R5_RELIABILITY_BUFFER_RATIO:-0.10}
      R5_MATRIX_MAX_POINTS: ${R5_MATRIX_MAX_POINTS:-100}
      R5_MATRIX_BLOCK_MAX_PAIRS: ${R5_MATRIX_BLOCK_MAX_PAIRS:-2500}
      R5_MATRIX_TIME_WINDOW_MINUTES: ${R5_MATRIX_TIME_WINDOW_MINUTES:-10}
      R5_MAX_TRAVEL_MINUTES: ${R5_MAX_TRAVEL_MINUTES:-240}
    ports:
      - "8003:8003"
    volumes:
      - r5_osm:/data/osm:ro
      - ./transit/generated:/data/gtfs:ro
      - r5_cache:/root/.cache/r5py
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 5m
    depends_on:
      r5-osm:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
    container_name: routing_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://routing:routing@postgres:5432/routing
      VALHALLA_URL: http://valhalla:8002
      R5_URL: http://r5:8003
      R5_GTFS_PATH: /app/transit/moscow-pilot.gtfs.zip
      WALKING_SPEED_KMH: ${R5_WALKING_SPEED_KMH:-4.8}
      R5_TIMEOUT_SECONDS: ${R5_TIMEOUT_SECONDS:-180}
      R5_MATRIX_BLOCK_ORIGINS: ${R5_MATRIX_BLOCK_ORIGINS:-5}
      R5_MATRIX_BLOCK_MAX_PAIRS: ${R5_MATRIX_BLOCK_MAX_PAIRS:-500}
      R5_MATRIX_SINGLE_MAX_POINTS: ${R5_MATRIX_MAX_POINTS:-100}
      CUOPT_TIME_LIMIT_SECONDS: ${CUOPT_TIME_LIMIT_SECONDS:-1.0}
      CUOPT_MAX_TIME_LIMIT_SECONDS: ${CUOPT_MAX_TIME_LIMIT_SECONDS:-120.0}
      CUOPT_DISTANCE_WEIGHT: ${CUOPT_DISTANCE_WEIGHT:-1.0}
      # подпись токенов входа: в общем окружении задайте свою строку
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      # пароль администратора: в миграции его нет, он ставится при старте бэкенда.
      # Локально задаётся в .env рядом с docker-compose.yml, иначе будет «admin»
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    # решатель cuOpt работает внутри бэкенда и считает на видеокарте NVIDIA
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src:ro
      - ./transit/generated:/app/transit:ro
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    # здоров — когда отвечает API: по этому ждут диспетчерский и мобильный фронтенды
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/').read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # база нужна для старта, при её перезапуске бэкенд перезапускается следом (restart: true).
    # Маршрутизаторы — только запущены: Valhalla и R5 собирают данные минутами, а без них
    # бэкенд работает и честно отвечает 503 на расчёты. R5 — в профиле transit, его может не быть
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      valhalla:
        condition: service_started
      r5:
        condition: service_started
        required: false

  frontend:
    image: node:22-alpine
    container_name: routing_frontend
    restart: unless-stopped
    # без API интерфейс бесполезен: стартует, когда бэкенд ответил на health
    depends_on:
      backend:
        condition: service_healthy
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # node_modules в отдельном томе: не затирается тем, что установлено на хосте
      - frontend_node_modules:/app/node_modules
    environment:
      # по умолчанию бэкенд берётся из compose по имени сервиса; при отладке бэкенда
      # локально запусти: VITE_API_TARGET=http://host.docker.internal:8000 docker compose up -d frontend
      VITE_API_TARGET: ${VITE_API_TARGET:-http://backend:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install && npm run dev"

  # мобильное приложение бригады — отдельный фронтенд рядом с диспетчерским, тот же бэкенд
  mobile:
    image: node:22-alpine
    container_name: routing_mobile
    restart: unless-stopped
    # без API интерфейс бесполезен: стартует, когда бэкенд ответил на health
    depends_on:
      backend:
        condition: service_healthy
    working_dir: /app
    ports:
      - "5175:5175"
    volumes:
      - ./mobile:/app
      - mobile_node_modules:/app/node_modules
    environment:
      VITE_API_TARGET: ${VITE_API_TARGET:-http://backend:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install && npm run dev"

volumes:
  db_data:
  valhalla_tiles_390:
  frontend_node_modules:
  r5_cache:
  r5_osm:
  mobile_node_modules:
