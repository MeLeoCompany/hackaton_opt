[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routing-backend"
version = "0.1.0"
description = "API сервиса планирования маршрутов выездных инженеров"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.30.0",
    "pydantic-settings==2.6.0",
    "httpx==0.27.2",
    "numpy==2.1.3",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
# решатель cuOpt на видеокарте NVIDIA; ставится с дополнительного индекса:
#   pip install -e ".[solver]" --extra-index-url https://pypi.nvidia.com
solver = [
    "cuopt-cu13==26.8.*",
]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# FastAPI штатно объявляет Depends()/File() в значениях параметров.
ignore = ["B008", "ISC004"]

[tool.mypy]
python_version = "3.12"
strict = true
